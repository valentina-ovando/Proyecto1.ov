<!-- paginas/productos/productos.component.html -->
 <input [(ngModel)]="buscar" placeholder="Buscar producto...">
<button (click)="cargar()">Buscar</button>
@for (p of productos; track p.id) {
 <div class="tarjeta">
 <img [src]="'http://localhost/api_proyecto/public/uploads/' + p.imagen"
[alt]="p.nombre">
 <h3>{{ p.nombre }}</h3>
 <p>{{ p.descripcion }}</p>
 <strong>${{ p.precio }}</strong>
 <button (click)="agregar(p.id)">Agregar al carrito</button>
 <button (click)="favorito(p.id)">Favorito</button>
 </div>
} @empty {
 <p>No se encontraron productos.</p>
}
