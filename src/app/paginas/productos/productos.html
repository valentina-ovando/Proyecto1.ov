<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<div class="cards-container">

@for(p of Producto; track p.id){
@if (p.disponibilidad){

<div class="card">

  <img src="{{p.imagen}}" class="card-img-top" alt="producto">

  <div class="card-body">

    <h5 class="card-title">{{p.nombre}}</h5>

    <p class="card-text precio">${{p.precio}}</p>

    <p class="card-text">{{p.categoria}}</p>

    <div class="botones">

      <!-- <button class="btn-fav" (click)="toggleFavorito(producto: p)"> -->
        <!-- <i [class]="esFavorito(p.id) ? 'fas fa-heart' : 'far fa-heart'"></i> -->
      <!-- </button> -->

     <div class="botones">

  <button
    class="btn-carrito"
    (click)="agregarCarrito(p)">
     Agregar al carrito
  </button>

  <button
    class="btn-favorito"
    (click)="agregarFavorito(p)">
    
  </button>

  <button
    class="btn btn-vermas"
    type="button"
    data-bs-toggle="collapse"
    [attr.data-bs-target]="'#descripcion' + p.id">
    Ver más
  </button>

</div>

 


    </div>

    <!-- DESCRIPCIÓN -->
    <div 
      class="collapse mt-3"
      [attr.id]="'descripcion' + p.id">

      <div class="descripcion-box">
        {{p.descripcion}}
      </div>

    </div>

  </div>

</div>

}
}

</div>
