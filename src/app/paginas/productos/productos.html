

<div class="cards-container">

@for(p of Producto; track p.id){
@if (p.disponibilidad){

<div class="card">

  <img src="{{p.imagen}}" class="card-img-top" alt="producto">

  <div class="card-body">

    <h5 class="card-title">{{p.nombre}}</h5>

    <p class="card-text precio">${{p.precio}}</p>

    <p class="card-text">{{p.categoria}}</p>

    <div class="botones">

      <!-- BOTÓN AGREGAR AL CARRITO -->
      <button
        class="btn btn-primary"
        (click)="agregarAlCarrito(p)">
        Agregar al carrito
      </button>

      <!-- BOTÓN VER MÁS -->
      <button 
        class="btn btn-vermas"
        type="button"
        data-bs-toggle="collapse"
        [attr.data-bs-target]="'#descripcion' + p.id">

        Ver más
      </button>

    </div>

    <!-- DESCRIPCIÓN -->
    <div 
      class="collapse mt-3"
      [attr.id]="'descripcion' + p.id">

      <div class="descripcion-box">
        {{p.descripcion}}
      </div>

    </div>

  </div>

</div>

}
}

</div>
