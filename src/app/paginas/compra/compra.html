<div class="compra-container">
  <h2 class="compra-titulo">Resumen de tu compra</h2>

  @if (items().length > 0) {
    <div class="compra-card">
      @for (i of items(); track i.id_producto) {
        <div class="compra-item">
          <span class="item-nombre">{{ i.nombre }}</span>
          <span class="item-cantidad">x {{ i.cantidad }}</span>
          <span class="item-precio">${{ i.precio_unitario }}</span>
        </div>
      }

      <div class="compra-total">
        <span>Total</span>
        <strong>${{ total() }}</strong>
      </div>

      <button class="btn-confirmar" (click)="finalizar()">Confirmar compra</button>
    </div>
  } @else {
    <p class="compra-vacio">No hay productos en el carrito.</p>
  }
</div>
