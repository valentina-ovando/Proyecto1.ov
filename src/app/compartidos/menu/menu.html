<nav>
 <a routerLink="/inicio">Inicio</a>
 <a routerLink="/productos">Productos</a>
 <a routerLink="/paginas/ofertas">Ofertas</a>
 <a routerLink="/paginas/contacto">Contacto</a>
 @if (auth.estaLogueado()) {
 <!-- Este enlace aparece SOLO si el usuario que inició sesión es admin -->
 @if (auth.esAdmin()) {
 <a routerLink="/paginas/admin">Panel admin</a>
 }
 <span>Hola, {{ auth.nombreUsuario() }}</span>
 <button (click)="salir()">Salir</button>
 } @else {
 <a routerLink="/auth/inicio-sesion">Ingresar</a>
 <a routerLink="/auth/registro">Registrarse</a>
 }
</nav>
