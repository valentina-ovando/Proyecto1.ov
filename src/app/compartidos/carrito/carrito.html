<table class="table table-bordered border-danger-subtle">
  <thead>
    <tr>
      <th>#</th>
      <th>Producto</th>
      <th>Precio</th>
      <th>Cantidad</th>
      <th>Eliminar</th>
    </tr>
  </thead>

  <tbody>

    @for (p of productosCarrito; track p.id; let i = $index) {

    <tr>
      <td>{{ i + 1 }}</td>

      <td>{{ p.nombre }}</td>

      <td>${{ p.precio }}</td>

      <td>

        <button
          class="btn btn-sm btn-outline-danger me-2"
          (click)="restarCantidad(p)">
          -
        </button>

        {{ p.cantidad }}

        <button
          class="btn btn-sm btn-outline-success ms-2"
          (click)="sumarCantidad(p)">
          +
        </button>

      </td>

      <td>
        <button
          class="btn btn-danger btn-sm"
          (click)="eliminarProducto(p.id)">
          Eliminar
        </button>
      </td>

    </tr>

    }

  </tbody>
</table>
