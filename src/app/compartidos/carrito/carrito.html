<table class="table table-bordered border-danger-subtle text-center align-middle">

  <thead>
    <tr>
      <th>Imagen</th>
      <th>Producto</th>
      <th>Cantidad</th>
      <th>Eliminar</th>
    </tr>
  </thead>

  <tbody>

    @for (p of productosCarrito; track p.id) {

    <tr>

      <td>
        <img [src]="p.imagen" width="80">
      </td>

      <td>
        {{ p.nombre }}
      </td>

      <td>

        <button
          class="btn btn-sm btn-outline-danger"
          (click)="disminuir(p.id)">
          -
        </button>

        <span class="mx-2">
          {{ p.cantidad }}
        </span>

        <button
          class="btn btn-sm btn-outline-success"
          (click)="aumentar(p.id)">
          +
        </button>

        <br><br>

        <strong>${{ p.precio * p.cantidad }}</strong>

      </td>

      <td>

        <button
          class="btn btn-danger"
          (click)="eliminar(p.id)">
          Eliminar
        </button>

      </td>

    </tr>

    }

  </tbody>

</table>
