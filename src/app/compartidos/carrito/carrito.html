@if (!cargando) {
  @if (items.length === 0) {
    <p class="text-center mt-5">Tu carrito está vacío.</p>
  } @else {
    <table class="table table-bordered border-danger-subtle text-center align-middle">
      <thead>
        <tr>
          <th>Imagen</th>
          <th>Producto</th>
          <th>Cantidad</th>
          <th>Eliminar</th>
        </tr>
      </thead>

      <tbody>
        @for (p of items; track p.id_producto) {
          <tr>
            <td>
              <img [src]="p.imagen" width="80" [alt]="p.nombre">
            </td>

            <td>{{ p.nombre }}</td>

            <td>
              <button class="btn btn-sm btn-outline-danger" (click)="restar(p)">-</button>

              <span class="mx-2">{{ p.cantidad }}</span>

              <button class="btn btn-sm btn-outline-success" (click)="sumar(p)">+</button>

              <br><br>

              <strong>${{ subtotal(p) }}</strong>
            </td>

            <td>
              <button class="btn btn-danger" (click)="quitar(p.id_producto)">
                Eliminar
              </button>
            </td>
          </tr>
        }
      </tbody>
    </table>

    <!-- TOTAL Y BOTONES -->
    <div class="text-center mt-5 mb-4">
      <h4 class="mb-3">
        Total de la compra:
        <strong>${{ total() }}</strong>
      </h4>

      <button class="btn btn-outline-secondary px-4 py-2 me-2" (click)="vaciar()">
        Vaciar carrito
      </button>

      <button class="btn btn-success px-5 py-2" (click)="finalizarCompra()">
        Finalizar compra
      </button>
    </div>
  }
}
