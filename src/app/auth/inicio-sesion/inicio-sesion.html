<section class="login">
  <div class="login-card">
    <h2 class="login-titulo">Iniciar sesión</h2>

    <form (ngSubmit)="ingresar()">
      <input
        type="email"
        name="email"
        [(ngModel)]="email"
        placeholder="Email"
        autocomplete="username"
        required>

      <input
        type="password"
        name="clave"
        [(ngModel)]="clave"
        placeholder="Contraseña"
        autocomplete="current-password"
        required>

      @if (error()) {
        <p class="login-error">{{ error() }}</p>
      }

      <button type="submit" class="btn-ingresar">Ingresar</button>
    </form>

    <p class="login-registro">
      ¿No tenés cuenta?
      <a href="/auth/registro">Registrarse</a>
    </p>
  </div>
</section>
