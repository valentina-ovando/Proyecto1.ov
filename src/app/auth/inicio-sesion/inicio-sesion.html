<div class="login-container">
  <div class="login-card">

    <h1>Nail Salon</h1>
    <p class="subtitulo">Iniciar sesión</p>

    <div class="row">
      <div class="col-md-6 mb-3">
        <input
          type="text"
          class="form-control input-pink"
          placeholder="Usuario">
      </div>

      <div class="col-md-6 mb-3">
        <input
          type="password"
          class="form-control input-pink"
          placeholder="Contraseña">
      </div>
    </div>

    <button class="btn btn-login w-100">
      Ingresar
    </button>

    <p class="registro-texto">
      ¿No tiene cuenta?
      <a routerLink="/auth/registro">Registrarse</a>
    </p>

  </div>
</div>
