<div class="registro-container">
  <div class="registro-card">

    <h1>Crear Cuenta</h1>
    <p class="subtitulo">Complete sus datos</p>

    <div class="row">
      <div class="col-md-6 mb-3">
        <input type="text" class="form-control input-pink" placeholder="Nombre">
      </div>

      <div class="col-md-6 mb-3">
        <input type="text" class="form-control input-pink" placeholder="Apellido">
      </div>
    </div>

    <div class="mb-3">
      <input type="email" class="form-control input-pink" placeholder="Correo electrónico">
    </div>

    <div class="row">
      <div class="col-md-6 mb-3">
        <input type="password" class="form-control input-pink" placeholder="Contraseña">
      </div>

      <div class="col-md-6 mb-3">
        <input type="password" class="form-control input-pink" placeholder="Confirmar contraseña">
      </div>
    </div>

    <button class="btn btn-registro w-100">
      Crear cuenta
    </button>

    <p class="login-texto">
      ¿Ya tiene cuenta?
      <a href="#">Iniciar sesión</a>
    </p>

  </div>
</div>
